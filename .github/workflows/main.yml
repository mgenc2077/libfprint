name: Build Linux packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the release
    steps:
      # Build directly from the pushed branch (master). The upstream
      # goodix-fp-linux-dev workflow first merged its goodixtls/sigfm branches
      # into a 'buildpackage' branch; those branches don't exist in this fork —
      # the goodixtls53xd (538d) driver lives on the build branch directly.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Resolve release tag and package version
        id: rel
        # RAW_TAG is the pushed tag (github.ref_name) or the workflow_dispatch
        # input. Passed via env (not inline ${{ }}) to avoid shell injection.
        # PKG_VERSION drops the leading 'v' so packages are versioned e.g. 1.0.0.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Reject anything that isn't a clean vX.Y.Z(-suffix) tag before it is
          # used in sed below: a tag/input may legally contain shell and sed
          # metacharacters (';', '$', '/', backticks), and GNU sed's 'e' command
          # would turn substitution into arbitrary code execution.
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Refusing to release: tag '$RAW_TAG' is not a valid version (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=${RAW_TAG#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        # Only what the goodixtls53xd driver + packaging need: gusb,
        # gobject-introspection (for the GIR/typelib nfpm ships), and openssl
        # (libssl-dev) for the goodixtls TLS helper. pixman/cairo/nss/opencv are
        # omitted since we build a single driver, and gtk-doc since docs are off.
        run: sudo apt-get install -y libgusb-dev libgirepository1.0-dev libssl-dev
      - name: Install meson and ninja
        run: pip install 'meson==1.12.0' 'ninja==1.13.0'

      - name: Build libfprint (goodixtls53xd only)
        # The goodixtls driver was cleaned up to compile under the default
        # -Werror (no -Dwerror=false / -Wno-error escape hatches needed).
        # -Ddrivers=goodixtls53xd: build only the 538d driver (avoids pixman
        # via aes3500). -Dudev_rules=enabled: our single driver doesn't pull
        # the 'udev' helper, so rules are off by default and packaging needs
        # 70-libfprint-2.rules — force it on. -Ddoc=false: docs aren't packaged.
        # Build dir is 'build' to match the nfpm steps below.
        run: |
          meson setup build --prefix /usr/ --buildtype=release -Ddrivers=goodixtls53xd -Dudev_rules=enabled -Dudev_rules_dir=/usr/lib/udev/rules.d -Ddoc=false
          meson compile -C build --verbose
      - name: Install nFPM
        run: echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list && sudo apt update && sudo apt install nfpm
      - name: Prepare nFPM DEB config
        run: cd /home/runner/work/libfprint/libfprint && cp nfpm_deb_sample.yaml nfpm_deb.yaml && sed -i "s/COMMITID/$(git rev-parse --short HEAD)/g" nfpm_deb.yaml && mkdir ./output && cd /home/runner/work/libfprint/libfprint/build && sed -i "s/LIBVERSION/$PKG_VERSION/g" /home/runner/work/libfprint/libfprint/nfpm_deb.yaml
      - name: Prepare nFPM RPM config
        run: cd /home/runner/work/libfprint/libfprint && cp nfpm_rpm_sample.yaml nfpm_rpm.yaml && sed -i "s/COMMITID/$(git rev-parse --short HEAD)/g" nfpm_rpm.yaml && cd /home/runner/work/libfprint/libfprint/build && sed -i "s/LIBVERSION/$PKG_VERSION/g" /home/runner/work/libfprint/libfprint/nfpm_rpm.yaml
      - name: Prepare nFPM Arch config
        run: cd /home/runner/work/libfprint/libfprint && cp nfpm_arch_sample.yaml nfpm_arch.yaml && sed -i "s/COMMITID/$(git rev-parse --short HEAD)/g" nfpm_arch.yaml && cd /home/runner/work/libfprint/libfprint/build && sed -i "s/LIBVERSION/$PKG_VERSION/g" /home/runner/work/libfprint/libfprint/nfpm_arch.yaml
      - name: Generating DEB package
        run: nfpm pkg --packager deb --config ./nfpm_deb.yaml --target ./output/
      - name: Generating RPM package
        run: nfpm pkg --packager rpm --config ./nfpm_rpm.yaml --target ./output/
      - name: Generating ArchLinux package
        run: nfpm pkg --packager archlinux --config ./nfpm_arch.yaml --target ./output/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          files: /home/runner/work/libfprint/libfprint/output/*
